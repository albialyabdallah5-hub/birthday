<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas#bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(214, 51, 132, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
        }

        .icon-header {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 8px;
        }

        p {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .pass-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            direction: ltr;
        }

        .pass-digit {
            width: 50px;
            height: 60px;
            background: #ffffff;
            border: 2px solid #f783ac;
            border-radius: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #d63384;
            text-align: center;
            outline: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .pass-digit:focus {
            border-color: #d63384;
            box-shadow: 0 0 12px rgba(214, 51, 132, 0.4);
            transform: translateY(-2px);
        }

        .surprise-box {
            display: none;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .surprise-box h2 {
            font-size: 2.5rem;
            color: #ff3366;
            margin: 15px 0;
            font-weight: 900;
        }

        .surprise-box p {
            font-size: 1.3rem;
            color: #495057;
            font-weight: 700;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="card">
        <div id="login-box">
            <div class="icon-header">🎁🎂</div>
            <h1>  Happy Birthday 🥳</h1>
            <p>Enter the password (1314) to see the surprise🎁🎂</p>

            <div class="pass-container">
                <input type="password" class="pass-digit" maxlength="1" onkeyup="moveFocus(this, 1)">
                <input type="password" class="pass-digit" maxlength="1" onkeyup="moveFocus(this, 2)">
                <input type="password" class="pass-digit" maxlength="1" onkeyup="moveFocus(this, 3)">
                <input type="password" class="pass-digit" maxlength="1" onkeyup="moveFocus(this, 4)">
            </div>
        </div>

        <div id="surprise-box" class="surprise-box">
            <div class="icon-header">🥳✨🎉</div>
            <h2>Happy Birthday 🥳</h2>
            <p>   Happy Birthday Wishing you years of health, happiness, and joy🎈🍰</p>
        </div>
    </div>

    <script>
        function moveFocus(current, nextIndex) {
            if (current.value.length === 1) {
                const inputs = document.querySelectorAll('.pass-digit');
                if (nextIndex < 4) {
                    inputs[nextIndex].focus();
                } else {
                    checkPass();
                }
            }
        }

        function checkPass() {
            const inputs = document.querySelectorAll('.pass-digit');
            let enteredCode = "";
            inputs.forEach(input => enteredCode += input.value);

            if (enteredCode === "1314") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('surprise-box').style.display = 'block';
            } else {
                inputs.forEach(input => input.value = "");
                inputs[0].focus();
            }
        }

        // High Performance Canvas Sweets & Physics Script
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const emojis = ['🎂', '🧁', '🍰', '🎁', '🎈', '🍩', '🍫', '🍬', '🍭', '✨', '🌸', '🥳', '🍓', '🕯️'];
        const spriteCache = {};

        function getEmojiSprite(emoji) {
            if (spriteCache[emoji]) return spriteCache[emoji];
            const c = document.createElement('canvas');
            c.width = 64;
            c.height = 64;
            const cx = c.getContext('2d');
            cx.font = '40px sans-serif';
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            cx.fillText(emoji, 32, 32);
            spriteCache[emoji] = c;
            return c;
        }

        let sweetsCount = Math.min(120, Math.floor((window.innerWidth * window.innerHeight) / 9000));
        const sweets = [];

        for (let i = 0; i < sweetsCount; i++) {
            sweets.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: 20 + Math.random() * 25,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
                speedY: - (0.5 + Math.random() * 1.5),
                speedX: (Math.random() - 0.5) * 0.8,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.03,
                vx: 0,
                vy: 0
            });
        }

        let mouse = { x: -1000, y: -1000, active: false };

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                mouse.active = true;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.active = false;
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let s of sweets) {
                // Physics & Mouse Repulsion
                let dx = s.x - mouse.x;
                let dy = s.y - mouse.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let minDist = 100;

                if (mouse.active && dist < minDist) {
                    let force = (minDist - dist) / minDist;
                    let angle = Math.atan2(dy, dx);
                    s.vx += Math.cos(angle) * force * 3;
                    s.vy += Math.sin(angle) * force * 3;
                }

                // Apply velocities & damping
                s.vx *= 0.94;
                s.vy *= 0.94;

                s.x += s.speedX + s.vx;
                s.y += s.speedY + s.vy;
                s.rot += s.rotSpeed;

                // Boundaries looping
                if (s.y < -50) {
                    s.y = height + 50;
                    s.x = Math.random() * width;
                }
                if (s.x < -50) s.x = width + 50;
                if (s.x > width + 50) s.x = -50;

                // Render sprite
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rot);
                let sprite = getEmojiSprite(s.emoji);
                ctx.drawImage(sprite, -s.size / 2, -s.size / 2, s.size, s.size);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
